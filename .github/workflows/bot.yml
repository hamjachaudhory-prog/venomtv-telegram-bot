name: VenomTV Sports Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: venomtv-sports-bot
  cancel-in-progress: false

jobs:
  post-matches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sports bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py

      - name: Save posted match IDs
        run: |
          git config user.name "VenomTV Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_matches.json
          if ! git diff --cached --quiet; then
            git commit -m "Update posted match history"
            git push
          fi
